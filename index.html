al); HARVESTED = grown, caught or logged that year (crops, meat, fish, timber). These yearly figures are tagged MINED/HARVESTED even when listed under L1. REFINED = metals or fuels refined that year; MADE = steel, cement, chips, chemicals, power and paper made that year. CAPACITY = what plants could handle."},{label:"Shares",value:`Share of the world total in the source's own table, with world rank. Every country the source itemizes is listed and shaded; where a source lumps smaller producers into "Other countries", that total is shown separately. World Bank series use each country's latest reported year since 2015.`},{label:"Qualitative layers",value:"Sunlight is shaded by average solar strength (a value, not a share of the world). Climate, natural energy flows and oceans have no clean country-share data, so they are shown as notable countries without numbers."},{label:"Layers",value:"L1 Raw is what nature provides (in the ground, on the land, in the sea). L2 Extraction is what was actually mined, pumped, harvested, caught or logged last year. L3 Processing is where it is refined, smelted, converted or manufactured into fuels, power, metals, chemicals, chips and paper. Labor is a cross-cutting column (workforce and skills) that feeds every layer, so it has its own view. Each layer has its own numbered list beside the map; the arrow keys move within the current layer."},{label:"L1 vs L2 overlap",value:"L1 production figures and L2 extraction figures come from the same source tables, so a country profile lists each such figure once, under L1. L2 adds measures L1 does not have (manganese ore, palladium, gypsum, cereals, meat, roundwood)."},{label:"Gap tags",value:`For linked pairs (e.g. cobalt mining \u2192 cobalt refining) the profile compares a country's share of world extraction (L2) with its share of processing (L3): under a third = "Mines a lot, refines little"; over three times = "Refines far more than it mines". Where a source names only the top few countries,
