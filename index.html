hat year; MADE = steel, cement, chips, chemicals, power and paper made that year. CAPACITY = what plants could handle."},{label:"Shares",value:`Share of the world total in the source's own table, with world rank. Every country the source itemizes is listed and shaded; where a source lumps smaller producers into "Other countries", that total is shown separately. World Bank series use each country's latest reported year since 2015.`},{label:"Qualitative layers",value:"Sunlight is shaded by average solar strength (a value, not a share of the world). Climate, natural energy flows and oceans have no clean country-share data, so they are shown as notable countries without numbers."},{label:"Layers",value:"L1 Raw is what nature provides (in the ground, on the land, in the sea). L2 Extraction is what was actually mined, pumped, harvested, caught or logged last year. L3 Processing is where it is refined, smelted, converted or manufactured into fuels, power, metals, chemicals, chips and paper. Labor is a cross-cutting column (workforce and skills) that feeds every layer, so it has its own view. Each layer has its own numbered list beside the map; the arrow keys move within the current layer."},{label:"L1 vs L2 overlap",value:"L1 production figures and L2 extraction figures come from the same source tables, so a country profile lists each such figure once, under L1. L2 adds measures L1 does not have (manganese ore, palladium, gypsum, cereals, meat, roundwood)."},{label:"Gap tags",value:`For linked pairs (e.g. cobalt mining \u2192 cobalt refining) the profile compares a country's share of world extraction (L2) with its share of processing (L3): under a third = "Mines a lot, refines little"; over three times = "Refines far more than it mines". Where a source names only the top few countries, the others' processing share is unknown.`},{label:"Thin data",value:'Battery-mineral refining and refined nickel come from an IEA chart that names the top countries and lumps Europe as a bloc; polysilicon, wafers and chemical sales name only the leader (or two); chip fab capacity is 2022 data by region. The rest is shown as "Other". Water treatment/desalination and processed phosphate have no open country data.'},{label:"Map styles",value:"Metals, minerals, energy and their extraction and processing steps are drawn as circles at each country's centre, with circle area proportional to its share of the world (countries with data are lightly tinted underneath; clicking a circle opens that country). Land, water, forests, fish, crops, meat, timber, paper, population and labor are shaded in graded steps (40%+, 20-39%, 10-19%, 5-9%, 1-4%, under 1%). Sunlight is shaded by its solar-strength value. Climate, flows and oceans stay qualitative: a country-level K\xF6ppen climate-zone layer was not added because the open dataset (Beck et al. 2018) is a global raster that is too heavy to embed here."},{label:"Sub-item pies",value:"Groups with several items (e.g. base metals: copper, bauxite, nickel, zinc, lead, tin) open on an All view: each country gets a small pie. Pie area follows the average of that country's world shares across the group's items (so one item does not dominate just because it is listed); slices show its share of each item, side by side. The chips above the map switch to one item; where items have both reserves and mined figures, a RESERVES/MINED switch picks which set is used. The 80% callout applies to a single item."},{label:"80% callout",value:'For every share measure, the smallest set of countries that together reach 80% of the world total is outlined, with a label such as "3 countries = 80% of world". Where the source lumps many countries into "Other", the listed countries may not reach 80%, and the label says so. Value measures (solar strength) have no world total, so no callout.'},{label:"Geography",value:"Chokepoints are marked at their locations; river lines are simplified sketches of the main channel."}]})}),(0,h.jsx)(e0,{heading:"Sourc
