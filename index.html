abor is a cross-cutting column (workforce and skills) that feeds every layer, so it has its own view. Each layer has its own numbered ocean buttons; the arrow keys move within the current layer."},{label:"L1 vs L2 overlap",value:"L1 production figures and L2 extraction figures come from the same source tables, so a country profile lists each such figure once, under L1. L2 adds measures L1 does not have (manganese ore, palladium, gypsum, cereals, meat, roundwood)."},{label:"Gap tags",value:`For linked pairs (e.g. cobalt mining \u2192 cobalt refining) the profile compares a country's share of world extraction (L2) with its share of processing (L3): under a third = "Mines a lot, refines little"; over three times = "Refines far more than it mines". Where a source names only the top few countries, the others' processing share is unknown.`},{label:"Thin data",value:'Battery-mineral refining and refined nickel come from an IEA chart that names the top countries and lumps Europe as a bloc; polysilicon, wafers and chemical sales name only the leader (or two); chip fab capacity is 2022 data by region. The rest is shown as "Other". Water treatment/desalination and processed phosphate have no open country data.'},{label:"Map styles",value:"Metals, minerals, energy and their extraction and processing steps are drawn as circles at each country's centre, with circle area proportional to its share of the world (countries with data are lightly tinted underneath; clicking a circle opens that country). Land, water, forests, fish, crops, meat, timber, paper, population and labor are shaded in graded steps (40%+, 20-39%, 10-19%, 5-9%, 1-4%, under 1%). Sunlight is shaded by its solar-strength value. Climate, flows and oceans stay qualitative: a country-level K\xF6ppen climate-zone layer was not added because the open dataset (Beck et al. 2018) is a global raster that is too heavy to embed here."},{label:"Sub-item pies",value:"Groups with several items (e.g. base metals: copper, bauxite,
