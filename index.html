(manganese ore, palladium, gypsum, cereals, meat, roundwood)."},{label:"Gap tags",value:`For linked pairs (e.g. cobalt mining \u2192 cobalt refining) the profile compares a country's share of world extraction (L2) with its share of processing (L3): under a third = "Mines a lot, refines little"; over three times = "Refines far more than it mines". Where a source names only the top few countries, the others' processing share is unknown.`},{label:"Thin data",value:'Battery-mineral refining and refined nickel come from an IEA chart that names the top countries and lumps Europe as a bloc; polysilicon, wafers and chemical sales name only the leader (or two); chip fab capacity is 2022 data by region. The rest is shown as "Other". Water treatment/desalination and processed phosphate have no open country data.'},{label:"Map styles",value:"Metals, minerals, energy and their extraction and processing steps are drawn as circles at each country's centre, with circle area proportional to its share of the world (countries with data are lightly tinted underneath; clicking a circle opens that country). Land, water, forests, fish, crops, meat, timber, paper, population and labor are shaded in graded steps (40%+, 20-39%, 10-19%, 5-9%, 1-4%, under 1%). Sunlight is shaded by its solar-strength value. Climate, flows and oceans stay qualitative: a country-level K\xF6ppen climate-zone layer was not added because the open dataset (Beck et al. 2018) is a global raster that is too heavy to embed here."},{label:"Sub-item pies",value:"Groups with several items (e.g. base metals: copper, bauxite, nickel, zinc, lead, tin) open on an All view: each country gets a small pie. Pie area follows the average of that country's world shares across the group's items (so one item does not dominate just because it is listed); slices show its share of each item, side by side. The chips above the map switch to one item; where items have both reserves and mined figures, a RESERVES/MINED switch picks which set is used. The 80% callout applies to a single item."},{label:"80% callout",value:'For every share measure, the smallest set of countries that together reach 80% of the world total is outlined, with a label such as "3 countries = 80% of world". Where the source lumps many countries into "Other", the listed countries may not reach 80%, and the label says so. Value measures (solar strength) have no world total, so no callout.'},{label:"Geography",value:"Chokepoints are marked at their locations; river lines are simplified sketches of the main channel."}]})}),(0,m.jsx)(e0,{heading:"Sources",children:(0,m.jsx)(q2,{links:[{title:"Mineral Commodity Summaries 2026 data release",site:"USGS",date:"Feb 2026",href:"https://doi.org/10.5066/P1WKQ63T"},{title:"Statistical Review of World Energy 2026",site:"Energy Institute",date:"2026",href:"https://www.energyinst.org/statistical-review"},{title:"Oil, gas and coal production by country (EI + EIA)",site:"Our World in Data",href:"https://ourworldindata.org/grapher/oil-production-by-country"},{title:"World uranium mining production",site:"World Nuclear Association",date:"2026",href:"https://world-nuclear.org/information-library/nuclear-fuel-cycle/mining-of-uranium/world-uranium-mining-production"},{title:"Renewable internal freshwater resources (AQUASTAT)",site:"World Bank / FAO",href:"https://data.worldbank.org/indicator/ER.H2O.INTR.K3"},{title:"Arable land (hectares)",site:"World Bank / FAO",href:"https://data.worldbank.org/indicator/AG.LND.ARBL.HA"},{title:"Forest area (sq. km)",site:"World Bank / FAO",href:"https://data.worldbank.org/indicator/AG.LND.FRST.K2"},{title:"Total fisheries production (metric tons)",site:"World Bank / FAO",href:"https://data.worldbank.org/indicator/ER.FSH.PROD.MT"},{title:"Population, total",site:"World Bank",href:"https://data.worldbank.org/indicator/SP.POP.TOTL"},{title:"Statistical Review of World Energy 2026: consolidated dataset (refining, electricity)",site:"Energy Institute",date:"2026",href:"https
